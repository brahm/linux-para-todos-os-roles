# Ficha da receita desktop/codecs: o que ela é, os parâmetros que aceita, em que famílias
# de distro funciona e onde já foi testada. O bora lê este arquivo; o formato
# de cada campo está em receitas/README.md. O bloco testes: fica sempre por
# último, porque o ferramentas/registros/registrar.py acrescenta registros nele.
id: desktop/codecs
nome: Codecs de áudio e vídeo
descricao: Instala os codecs que as distros não trazem por padrão, para tocar MP3, MP4, MKV e os vídeos que vêm do celular.
risco: baixo
precisa_root: true
familias:
  ubuntu: testada
  debian: testada
  fedora: planejada
  arch: planejada
  fedora-imutavel: planejada
  opensuse: planejada
