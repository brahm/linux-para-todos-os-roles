id: ia/ollama
nome: Ollama, para modelos de IA no computador
descricao: Instala o Ollama oficial, conferido por SHA256, como um serviço que só este computador acessa, e baixa o modelo que o bora sugere para a máquina, se você quiser.
risco: medio
precisa_root: true
familias:
  ubuntu: testada
  debian: testada
  fedora: planejada
  arch: planejada
  fedora-imutavel: planejada
  opensuse: planejada
parametros:
  modelo:
    tipo: texto
    padrao: sugerido
    pergunta: "Qual modelo baixar? sugerido, para o bora escolher pela memória da máquina ({sugestao_de_modelo}), nenhum, para você baixar depois com ollama pull, ou o nome de um modelo, como qwen3:4b."
    descricao: O modelo que a receita baixa. "sugerido" vira, no plano, o modelo que o bora modelos sugere para esta máquina; "nenhum" instala só o Ollama.
testes: []
