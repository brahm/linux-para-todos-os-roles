# Os modelos que o bora sugere para programar no próprio computador.
#
# O bora mede a memória da máquina (a RAM e, se houver, a da placa de vídeo),
# confere quais destes cabem e sugere o melhor que roda bem. Veja com
# "bora modelos". A ordem importa: do mais simples para o mais capaz, e a
# sugestão é o último da lista que roda bem na máquina.
#
# Campos:
#   ollama      o nome no Ollama, com a quantização, para baixar sempre o mesmo arquivo
#   nome        como procurar o modelo no LM Studio (aba Discover)
#   tamanho_gb  o tamanho do download, que é quase o que ele ocupa na memória
#   ativos_b    bilhões de parâmetros usados a cada palavra; num modelo
#               "mixture of experts" é bem menos que o total, e por isso ele
#               anda rápido mesmo sem placa de vídeo
#   agente      se ele dá conta de usar ferramentas, como um agente de
#               programação precisa (ler arquivos, rodar comandos)
#
# Ao mudar a lista, confira o nome e o tamanho em https://ollama.com/library
# e troque a data.
verificado_em: 2026-11-09
modelos:
  - ollama: qwen3:1.7b
    nome: Qwen3 1.7B
    tamanho_gb: 1.4
    ativos_b: 1.7
    agente: false
    nota: Cabe quase em qualquer lugar. Serve para conversar e tirar dúvidas, não para um agente.
  - ollama: qwen3:4b
    nome: Qwen3 4B
    tamanho_gb: 2.5
    ativos_b: 4
    agente: false
    nota: Explica código e responde dúvidas. Como agente, se perde com facilidade.
  - ollama: ornith:9b-q4_K_M
    nome: Ornith 9B
    tamanho_gb: 5.6
    ativos_b: 9
    agente: true
    nota: Pequeno e feito para programar com agentes.
  - ollama: mimo-v2.6:9b-q4_K_M
    nome: MiMo V2.6 9B
    tamanho_gb: 6.6
    ativos_b: 9
    agente: true
    nota: Da Xiaomi, para código e agentes.
  - ollama: gpt-oss:20b
    nome: gpt-oss 20B
    tamanho_gb: 14
    ativos_b: 3.6
    agente: true
    nota: Da OpenAI, aberto. Usa poucos parâmetros por vez e anda bem sem placa de vídeo.
  - ollama: qwen3-coder:30b
    nome: Qwen3 Coder 30B
    tamanho_gb: 19
    ativos_b: 3.3
    agente: true
    nota: Feito para programar, com contexto longo. Anda bem sem placa de vídeo.
  - ollama: qwen3.8:27b-q4_K_M
    nome: Qwen3.8 27B
    tamanho_gb: 18
    ativos_b: 27
    agente: true
    nota: Muito bom com agentes, mas usa todos os parâmetros a cada palavra; sem placa de vídeo, fica lento.
  - ollama: gpt-oss:120b
    nome: gpt-oss 120B
    tamanho_gb: 65
    ativos_b: 5.1
    agente: true
    nota: O maior da lista, para máquinas com muita memória.
