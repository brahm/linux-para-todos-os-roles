    versao: "26.04"
    data: 2026-11-06
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: ubuntu
    versao: "24.04"
    data: 2026-11-06
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: debian
