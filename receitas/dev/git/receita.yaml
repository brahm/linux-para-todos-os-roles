# Ficha da receita dev/git: o que ela é, os parâmetros que aceita, em que famílias
# de distro funciona e onde já foi testada. O bora lê este arquivo; o formato
# de cada campo está em receitas/README.md. O bloco testes: fica sempre por
# último, porque o ferramentas/registros/registrar.py acrescenta registros nele.
id: dev/git
nome: Git
descricao: Instala o Git com o seu nome e o seu e-mail nos commits, e cria uma chave SSH para o GitHub ou o GitLab.
risco: baixo
precisa_root: true
familias:
  ubuntu: testada
  debian: testada
  fedora: planejada
  arch: planejada
  fedora-imutavel: planejada
  opensuse: planejada
parametros:
  nome:
    tipo: texto
    padrao: auto
    pergunta: Que nome vai nos seus commits? "auto" mantém o que já estiver configurado, ou usa o nome da sua conta neste computador.
  email:
    tipo: texto
    pergunta: Que e-mail vai nos seus commits? Use o mesmo da sua conta no GitHub ou no GitLab. Em branco, mantém o que já estiver configurado.
  chave_ssh:
    tipo: booleano
    padrao: true
    descricao: Criar uma chave SSH para o GitHub ou o GitLab, se a pessoa ainda não tiver uma.
  usuario:
    tipo: texto
    padrao: auto
    descricao: A conta que vai programar. "auto" é quem rodou o bora com sudo.
testes:
  - distro: ubuntu
    versao: "26.04"
    data: 2026-11-06
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: ubuntu
    versao: "24.04"
    data: 2026-11-06
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: debian
    versao: "13"
    data: 2026-11-06
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: debian
    versao: "13"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
  - distro: ubuntu
    versao: "24.04"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
  - distro: ubuntu
    versao: "26.04"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
