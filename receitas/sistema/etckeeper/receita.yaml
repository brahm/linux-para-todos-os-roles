# Ficha da receita sistema/etckeeper: o que ela é, os parâmetros que aceita, em que famílias
# de distro funciona e onde já foi testada. O bora lê este arquivo; o formato
# de cada campo está em receitas/README.md. O bloco testes: fica sempre por
# último, porque o ferramentas/registros/registrar.py acrescenta registros nele.
id: sistema/etckeeper
nome: Histórico do /etc
descricao: Guarda cada mudança na configuração do sistema (a pasta /etc) num histórico do Git, para ver o que mudou, quando e voltar um arquivo.
risco: baixo
precisa_root: true
familias:
  ubuntu: testada
  debian: testada
  fedora: planejada
  arch: planejada
  fedora-imutavel: nao-se-aplica
  opensuse: planejada
testes:
  - distro: ubuntu
    versao: "26.04"
    data: 2026-11-07
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: ubuntu
    versao: "24.04"
    data: 2026-11-07
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: debian
    versao: "13"
    data: 2026-11-07
    por: testes-automaticos
    onde: conteiner
    resultado: ok
  - distro: debian
    versao: "13"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
  - distro: ubuntu
    versao: "24.04"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
  - distro: ubuntu
    versao: "26.04"
    data: 2026-11-08
    por: testes-automaticos
    onde: vm
    resultado: ok
