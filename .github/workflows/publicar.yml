# Publica os binários do bora quando a versão muda.
#
# A versão sai do Cargo.toml. Quando um push na main traz uma versão que ainda
# não tem tag (por exemplo, o merge de um pull request que sobe de 0.4.0 para
# 0.5.0), este workflow compila, cria a tag vX.Y.Z e a página da versão, tudo
# aqui no GitHub. Não é preciso rodar git tag na máquina de ninguém.
#
# Também dá para publicar à mão em Actions, Publicar, Run workflow, e uma tag
# v* enviada do jeito antigo continua funcionando.
name: Publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  versao:
    name: Ver se há versão nova
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publicar: ${{ steps.ver.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$versao"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $versao do Cargo.toml."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "Só a main publica versões. Nada a fazer em $GITHUB_REF_NAME."
            publicar=false
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A versão $tag já foi publicada. Nada a fazer."
            publicar=false
          else
            echo "A versão $tag ainda não existe e vai ser publicada."
            publicar=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"

  compilar:
    name: Binário ${{ matrix.arquitetura }}
    needs: versao
    if: needs.versao.outputs.publicar == 'true'
    strategy:
      matrix:
        include:
          - arquitetura: x86_64
            maquina: ubuntu-24.04
          - arquitetura: aarch64
            maquina: ubuntu-24.04-arm
    runs-on: ${{ matrix.maquina }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust com musl
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.arquitetura }}-unknown-linux-musl
          rustup default stable
      - name: Testes
        run: cargo test --locked
      - name: Compilar
        run: |
          cargo build --release --locked --target ${{ matrix.arquitetura }}-unknown-linux-musl
          mkdir -p saida
          cp target/${{ matrix.arquitetura }}-unknown-linux-musl/release/bora saida/bora-linux-${{ matrix.arquitetura }}
          saida/bora-linux-${{ matrix.arquitetura }} versao
      - uses: actions/upload-artifact@v4
        with:
          name: bora-linux-${{ matrix.arquitetura }}
          path: saida/bora-linux-${{ matrix.arquitetura }}

  publicar:
    name: Criar a versão
    needs: [versao, compilar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Somas de verificação
        working-directory: saida
        run: sha256sum bora-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
        # Se a tag ainda não existe, o gh cria no commit que está sendo publicado.
        run: |
          gh release create "$TAG" saida/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "bora $TAG" \
            --generate-notes
