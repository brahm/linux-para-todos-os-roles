# Testa o bora e as receitas a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unidade:
    name: Testes do bora e shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes do bora
        run: cargo test
      - name: Catálogo
        run: cargo run --quiet -- conferir
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR receitas/comum.sh receitas/*/*/*.sh testes/conteiner/*.sh testes/vm/qemu/*.sh ferramentas/pipes/*.sh ferramentas/notas/*.sh ferramentas/registros/*.sh ferramentas/estilo/*.sh
      - name: Pipes que quebram com pipefail
        run: ferramentas/pipes/conferir.sh
      - name: Clichês que o guia de estilo proíbe
        run: ferramentas/estilo/conferir.sh

  binario:
    name: Binário estático
    needs: unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust com musl
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - name: Compilar
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: bora-x86_64
          path: target/x86_64-unknown-linux-musl/release/bora
          retention-days: 7

  receitas:
    name: Receitas em ${{ matrix.imagem }}
    needs: binario
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { imagem: "ubuntu:24.04", distro: ubuntu, versao: "24.04" }
          - { imagem: "ubuntu:26.04", distro: ubuntu, versao: "26.04" }
          - { imagem: "debian:13", distro: debian, versao: "13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: bora-x86_64
          path: binario
      - run: chmod +x binario/bora
      - name: Montar a imagem de teste
        run: docker build -t bora-teste --build-arg IMAGEM=${{ matrix.imagem }} testes/conteiner
      - name: Aplicar, aplicar de novo e desfazer
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/rodar.sh
      - name: Cenários do firewall
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/cenarios.sh
      - name: Cenários do backup da pasta pessoal
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/backup.sh
      - name: Rolê Dar vida nova a uma máquina antiga
        # O Xfce no Ubuntu e o LXQt no Debian, para os dois ambientes passarem a cada pull request.
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -e AMBIENTE=${{ matrix.imagem == 'debian:13' && 'lxqt' || 'xfce' }} -v "$PWD":/bora bora-teste ./testes/conteiner/maquina-antiga.sh
      - name: Rolê Começar a programar, perfil Python
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -e PERFIL=python -v "$PWD":/bora bora-teste ./testes/conteiner/comecar-a-programar.sh
      - name: Rolê Começar a programar, perfil web
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -e PERFIL=web -v "$PWD":/bora bora-teste ./testes/conteiner/comecar-a-programar.sh
      - name: Rolê Vibecodar, com todos os agentes, o VS Code e a caixa de areia
        # O runner (Ubuntu 24.04) só deixa criar user namespaces com um perfil
        # do AppArmor, e o contêiner não tem AppArmor para carregar o perfil
        # da receita. Aqui a restrição sai do runner; a VM do CI confere o perfil.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/vibecodar.sh
      - name: Rolê Vibecodar, vibecode local com o Ollama e o LM Studio
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/vibecode-local.sh
      - name: Rolê Pasta compartilhada da casa
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/pasta-compartilhada.sh
      - name: Histórico do /etc, SSH e Sem Snap
        run: docker run --rm --privileged -e BORA=/bora/binario/bora -v "$PWD":/bora bora-teste ./testes/conteiner/novas-capacidades.sh
      - name: Marcar que a distro passou
        run: mkdir -p passou && echo "${{ matrix.distro }} ${{ matrix.versao }}" >passou/distro.txt
      - uses: actions/upload-artifact@v7
        with:
          name: passou-${{ matrix.distro }}-${{ matrix.versao }}
          path: passou/distro.txt
          retention-days: 7

  # Na main, grava o registro "onde: conteiner" de cada distro que passou, nas
  # receitas marcadas como "testada" na família dela, que são as que os passos
  # acima aplicam. Só muda o arquivo quando o resultado muda ou o registro
  # passou de 30 dias.
  registrar:
    name: Gravar o registro nas receitas
    needs: receitas
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: passou-*
          path: passou
      - name: Gravar nas receitas
        run: |
          shopt -s nullglob
          for marca in passou/passou-*/distro.txt; do
            read -r distro versao <"$marca"
            echo "== $distro $versao"
            python3 ferramentas/registros/registrar.py --onde conteiner \
              --distro "$distro" --versao "$versao" --data "$(date -u +%F)" --testadas-na-familia "$distro"
          done
      - name: Gravar na main e publicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: ferramentas/registros/gravar-na-main.sh "Registra o teste em contêiner de $(date -u +%F)"
